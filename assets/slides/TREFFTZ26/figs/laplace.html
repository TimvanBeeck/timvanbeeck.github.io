  /* the one piece that is not part of the static figure, so it stays quiet

  #switcher {

    display: flex; align-items: center; justify-content: flex-end; gap: 0.5em;
    padding: 0.1em 1em 0.4em; font-size: 0.8rem; color: #555;

  #switcher select {
    font-family: inherit; font-size: 1em; color: #000;
    background: #f3f5f7; border: 1px solid #cfd5db; border-radius: 4px;
    padding: 0.1em 0.4em; cursor: pointer;

  #switcher select:focus { outline: 2px solid #96c3eb; outline-offset: 1px; }
</style>

const select = document.getElementById('view-select');
D.options.forEach((o) => {
  const el = document.createElement('option');
  el.value = o.value;
  el.textContent = o.label;
  select.appendChild(el);
});
select.value = D.default;

const hidden = new Set();              // methods the legend has switched off

function tracesFor(view) {
  const v = D.views[view];
  const out = v.traces.map((t) => ({
    x: t.x, y: t.y, type: 'scatter', mode: 'lines+markers',
    visible: !hidden.has(t.key),
    line: {color: t.color, width: t.width},
    marker: {color: t.fill, symbol: t.symbol, size: 9,
             line: {color: t.color, width: 1.4}},
    showlegend: false,
    hovertemplate: t.hover + '<extra>' + t.label + '</extra>',
  }));
  v.guides.forEach((g) => out.push({
    x: g.x, y: g.y, type: 'scatter', mode: 'lines',
    line: {color: D.guideColor, width: 1.5, dash: 'dashdot'},
    showlegend: false, hoverinfo: 'skip',
  }));
  return out;
}

const MARGIN = {l: 68, r: 14, t: 14, b: 46};

function layoutFor(view) {
  const v = D.views[view];
  // the degrees of the error view, and the two slopes of Cond-H, are named
  // where they are drawn: the legend stays the three methods in every view
  const notes = v.labels.map((a) => ({
    text: a.text, x: a.x, y: a.y,
    xref: a.paper ? 'paper' : 'x', yref: a.paper ? 'paper' : 'y',
    xanchor: a.anchor || 'left', yanchor: a.valign || 'bottom',
    showarrow: false,
  }));
  v.guides.forEach((g) => notes.push({
    text: g.text, x: g.labelX, y: g.labelY, xref: 'x', yref: 'y',
    xanchor: g.xanchor, yanchor: g.yanchor, showarrow: false,
    font: {color: D.guideColor, size: D.font.size - 1},
  }));
  return {
    xaxis: v.axisX, yaxis: v.axisY,
    annotations: notes,
    showlegend: false,                 // the html legend under the plot instead
    margin: MARGIN, font: D.font,
    modebar: {orientation: 'v'},
    hovermode: 'closest',
    plot_bgcolor: '#fff', paper_bgcolor: '#fff',
  };
}

const config = {
  responsive: true, displaylogo: false, scrollZoom: true, displayModeBar: 'hover',
  modeBarButtonsToRemove: ['lasso2d', 'select2d'],
};

const plotDiv = document.getElementById('plot');
function draw() {
  return Plotly.react(plotDiv, tracesFor(select.value), layoutFor(select.value), config);
}

function drawLegend() {
  // the guides are named where they are drawn, so the legend is the three
  // methods in every view
  htmlLegend(document.getElementById('legend'), D.legend, (key, on) => {
    if (on) hidden.delete(key); else hidden.add(key);
    draw();
  });
}

whenSized(plotDiv, () => {
  Plotly.newPlot(plotDiv, tracesFor(select.value), layoutFor(select.value), config)
    .then(() => {
      drawLegend();
      select.addEventListener('change', () => { draw(); drawLegend(); });
      autoResize(plotDiv);
      forwardDeckNav('#plot');
      followDeckZoom(plotDiv, {
        'font.size': D.font.size,
        'margin.l': MARGIN.l, 'margin.r': MARGIN.r,
        'margin.t': MARGIN.t, 'margin.b': MARGIN.b,
      });
    });
});
</script>
