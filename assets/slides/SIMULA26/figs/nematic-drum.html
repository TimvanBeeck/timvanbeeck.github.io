<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nematic drum</title>
<!-- forwardDeckNav: hands the deck back the keys and background clicks this widget does not use -->
<script src="../js/plot-embed.js"></script>
<style>
  :root {
    --ink: #1c1f22;
    --soft: #6a747e;
    --line: #dfe3e8;
    --wash: #f3f5f7;
    --accent: #235f96;
    --font: 'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'Fira Mono', 'SFMono-Regular', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #fff; color: var(--ink); font-family: var(--font);
  }
  #stage {
    display: grid; grid-template-columns: 1fr 19rem; gap: 1.4rem;
    height: 100%; padding: 0.6rem 0.8rem;
  }

  /* ---- the plate ---- */
  #plate { position: relative; min-width: 0; }
  #board { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  #board:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #prompt, #solving {
    position: absolute; left: 50%; bottom: 0.2rem; transform: translateX(-50%);
    margin: 0; font-size: 0.78rem; color: var(--soft); letter-spacing: 0.04em;
  }
  #solving { background: rgba(255,255,255,0.9); padding: 0.1em 0.6em; }

  /* ---- the panel ---- */
  #panel {
    display: flex; flex-direction: column; gap: 0.55rem;
    min-width: 0; font-size: 0.82rem;
  }
  #equation {
    margin: 0; padding-bottom: 0.4rem; border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 0.78rem; color: var(--ink);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .chip {
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 0.15em 0.55em; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .dial { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.15rem 0.5rem; }
  .dial label { grid-column: 1; color: var(--soft); }
  .dial output { grid-column: 2; font-family: var(--mono); font-size: 0.76rem; }
  .dial input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  .dial--lead label { color: var(--ink); font-weight: 600; }

  #readout { margin: 0; color: var(--soft); line-height: 1.35; }
  #readout strong { color: var(--ink); font-weight: 600; font-family: var(--mono); }

  #modes-caption { margin: 0.2rem 0 0; font-size: 0.7rem; color: var(--soft); }
  #modes {
    list-style: none; margin: 0; padding: 0; min-height: 0; overflow: auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.15rem 0.4rem;
  }
  #modes button {
    display: flex; justify-content: space-between; gap: 0.4rem; width: 100%;
    font: inherit; font-size: 0.74rem; color: var(--soft);
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 0.1em 0.1em; cursor: pointer; text-align: left;
  }
  #modes button:hover { color: var(--ink); }
  #modes button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  #modes .hz { font-family: var(--mono); }

  #foot { display: flex; align-items: center; gap: 0.5rem; margin-top: auto; }
  #credit { margin: 0; font-size: 0.68rem; color: var(--soft); }
  #credit a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="plate">
    <canvas id="board" tabindex="0" role="application"
            aria-label="The drum. Click it to strike it."></canvas>
    <p id="prompt">tap the drum</p>
    <p id="solving" hidden>building the mesh</p>
  </div>

  <aside id="panel">
    <p id="equation">&alpha;&#8710;&sup2;u + &beta;&nabla;&middot;&nabla;(n&#7488;(&#8459;u)n) &minus; &#8710;u = k&sup2;u</p>

    <div class="chips" id="shapes"></div>

    <div class="dial dial--lead">
      <label for="ctl-theta">director angle &theta;</label>
      <output id="out-theta">0&deg;</output>
      <input type="range" id="ctl-theta" min="0" max="180" step="1" value="0">
    </div>
    <div class="dial">
      <label for="ctl-beta">nematic &beta;</label>
      <output id="out-beta">8.7e&minus;2</output>
      <input type="range" id="ctl-beta" min="0" max="900" step="1" value="870">
    </div>
    <div class="dial">
      <label for="ctl-alpha">capillarity &alpha;</label>
      <output id="out-alpha">1.0e&minus;1</output>
      <input type="range" id="ctl-alpha" min="0" max="1000" step="1" value="1000">
    </div>

    <p id="readout"></p>
    <p id="modes-caption">modes, in hertz &mdash; press one to hear it alone</p>
    <ol id="modes"></ol>

    <div id="foot">
      <button type="button" class="chip" id="btn-sound" aria-pressed="true">sound on</button>
      <p id="credit">from <a href="https://www.uzerbinati.eu/drum/" target="_blank"
         rel="noopener">nematic drum</a></p>
    </div>
  </aside>
</div>

worker.onerror = (e) => {
  els.solving.hidden = true;
  els.prompt.textContent = e.message || 'the solver could not be started';
  els.prompt.hidden = false;
};

function solve() {
  const preset = PRESETS_BY_ID.get(state.shapeId);
  const { polygon, align } = normalizeShape(preset.polygon, preset.latticePitch || 0);
  const nematic = nematicParams();
  state.solved = nematic;
  state.requestId += 1;
  els.prompt.hidden = true;
  els.solving.hidden = false;
  worker.postMessage({
    id: state.requestId, polygon, align,
    modes: MODES, targetNodes: TARGET_NODES, ...nematic,
  });
}

function onSolved(msg) {
  state.drum = { mesh: msg.mesh, modes: msg.modes, eigenvalues: msg.eigenvalues };
  state.weights = nodeWeights(msg.mesh);
  state.norms = modeNorms(msg.mesh, msg.modes, state.weights);
  state.freqs = frequencies(msg.eigenvalues, PITCH_HZ, state.solved.alpha);
  state.headroom = null;
  state.fieldBuf = new Float64Array(msg.mesh.nodeCount);
  state.strike = null;
  state.view = 'mode';
  state.selectedMode = 0;
  board.setDrum(state.drum);
  renderModes();
  renderReadout();
  els.prompt.textContent = 'tap the drum';
  els.prompt.hidden = false;
}

// --------------------------------------------------------------------- audio

let audioCtx = null;
let masterBus = null;

/** One shared limiter for every voice: overlapping strikes sum after each
 *  voice's own soft knee, and the destination has no limiter of its own. */
function ensureAudio() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    audioCtx = new Ctor();
    masterBus = audioCtx.createDynamicsCompressor();
    masterBus.threshold.value = -1;
    masterBus.knee.value = 0;
    masterBus.ratio.value = 20;
    masterBus.attack.value = 0.001;
    masterBus.release.value = 0.1;
    masterBus.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/** One loudness scale per mallet and drum, so relative strike loudness survives. */
function headroom() {
  if (state.headroom === null) {
    state.headroom = strikeHeadroom(
      state.drum.mesh, state.drum.modes, state.norms, state.freqs, state.weights,
      MALLET_RADIUS, CONTACT_RATIO, PITCH_HZ);
  }
  return state.headroom;
}

/** Sounds and animates a modal mixture -- every sound here goes through this,
 *  so one mode and a full strike cannot drift apart in how they are made. */
function ring({ amps, taus, kind, x = 0, y = 0, gain = 1 }) {
  const { drum, freqs } = state;

  // Reference amplitude for the colour bands: peak displacement near the moment
  // the fundamental first reaches full swing.
  const probe = new Float64Array(drum.mesh.nodeCount);
  fieldAtTime(drum.modes, amps, freqs, taus, 1 / (4 * freqs[0]), probe);
  let peak = 0;
  for (let i = 0; i < probe.length; i++) peak = Math.max(peak, Math.abs(probe[i]));

  // t0 is stamped by the first frame that draws this strike, not here: a rAF
  // callback carries the start time of its own frame, which can be earlier than
  // a clock read taken during the synchronous work below.
  state.strike = { kind, x, y, amps, taus, t0: null,
                   refAmp: peak > 1e-9 ? peak : 1, maxTau: Math.max(...taus) };
  state.view = 'struck';
  els.prompt.hidden = true;

  if (state.muted) return;
  const ctx = ensureAudio();
  if (!ctx) return;

  const samples = renderStrike({ freqs, amps, taus, sampleRate: ctx.sampleRate, gain });
  const buffer = ctx.createBuffer(1, samples.length, ctx.sampleRate);
  buffer.copyToChannel(samples, 0);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const out = ctx.createGain();
  out.gain.value = 0.85;
  src.connect(out).connect(masterBus);

  // Overlapping strikes are natural -- a real drum does not mute itself when you
  // hit it again -- but the pile-up has to be bounded.
  src.addEventListener('ended', () => {
    const i = state.voices.indexOf(src);
    if (i >= 0) state.voices.splice(i, 1);
  });
  state.voices.push(src);
  while (state.voices.length > MAX_VOICES) {
    const oldest = state.voices.shift();
    try { oldest.stop(); } catch { /* already finished */ }
  }
  src.start();
}

/** A mallet lands at (x, y). Every mode responds in proportion to how much it
 *  moves there, which is why where you hit changes the timbre. */
function strike(x, y) {
  if (!state.drum) return;
  if (!state.muted) ensureAudio();   // must be the first thing in the gesture, for iOS
  const projected = strikeAmplitudes(
    state.drum.mesh, state.drum.modes, x, y, MALLET_RADIUS, state.weights);
  const amps = audibleAmps(projected, state.norms, state.freqs, CONTACT_RATIO, PITCH_HZ);
  ring({ amps, taus: decayTimes(state.freqs, 1.7, BRIGHTNESS, PITCH_HZ),
         kind: 'strike', x, y, gain: TARGET_PEAK / headroom() });
  markMode(-1);
  els.readout.replaceChildren(document.createTextNode('all '), strong(String(state.freqs.length)),
                              document.createTextNode(' modes at once'));
}

/** Sounds one mode on its own, so the mixture a strike makes becomes legible. */
function playMode(i) {
  const { freqs } = state;
  if (!freqs || i < 0 || i >= freqs.length) return;
  if (!state.muted) ensureAudio();
  const amps = new Float64Array(freqs.length);
  amps[i] = 1;
  // A lone sinusoid needs far less gain than a strike to reach the same level.
  ring({ amps, taus: decayTimes(freqs, 1.7, BRIGHTNESS, PITCH_HZ), kind: 'mode', gain: 0.45 });
  state.selectedMode = i;
  markMode(i);
  renderReadout(i);
}

// ----------------------------------------------------------------- rendering

function frame(now) {
  try { drawFrame(now); } catch (err) {
    if (!frame.warned) { frame.warned = true; console.error('frame failed, continuing', err); }
  }
  requestAnimationFrame(frame);
}

function drawFrame(now) {
  board.resize();
  board.clear();
  if (!state.drum) return;

  let refAmp = 1, ringing = false, age = 0;

  if (state.view === 'struck' && state.strike) {
    if (state.strike.t0 === null) state.strike.t0 = now;
    const elapsed = Math.max(0, (now - state.strike.t0) / 1000);
    age = elapsed;
    // Under prefers-reduced-motion, hold the peak displacement instead of
    // animating the ring-out: the information survives, the movement does not.
    const t = reducedMotion ? Math.min(elapsed, 1 / (4 * state.freqs[0])) : elapsed;
    fieldAtTime(state.drum.modes, state.strike.amps, state.freqs, state.strike.taus,
                t, state.fieldBuf);
    refAmp = state.strike.refAmp;
    ringing = true;
    board.drawField(state.fieldBuf, refAmp);
    if (elapsed > state.strike.maxTau * 3.2) {
      state.view = 'mode';
      markMode(state.selectedMode);
      renderReadout(state.selectedMode);
      els.prompt.hidden = false;
    }
  } else {
    // At rest nothing is vibrating, so nothing may move or change colour: the
    // resting view is the selected mode as a still figure.
    state.fieldBuf.set(state.drum.modes[state.selectedMode] || state.drum.modes[0]);
    board.drawField(state.fieldBuf, 1);
  }

  // Over the field but under the outline: the director is a property of the
  // medium the plate is made of, not an annotation floating above it.
  board.drawDirector();
  board.drawOutline();
  if (ringing && state.strike.kind === 'strike') {
    board.drawStrikeMarker(state.strike.x, state.strike.y, age);
  }
}

function strong(s) {
  const n = document.createElement('strong');
  n.textContent = s;
  return n;
}

function renderReadout(i = 0) {
  if (!state.freqs) return;
  const f = state.freqs[i], f0 = state.freqs[0];
  const note = freqToNote(f);
  const parts = [document.createTextNode(i === 0 ? 'lowest mode ' : `mode ${i + 1} at `),
                 strong(`${f.toFixed(1)} Hz`), document.createTextNode(` (${note.label})`)];
  if (i > 0) parts.push(document.createTextNode(', '), strong(`\u00d7${(f / f0).toFixed(3)}`),
                        document.createTextNode(' the lowest'));
  els.readout.replaceChildren(...parts);
}

function markMode(i) {
  els.modes.querySelectorAll('button').forEach((b, k) => {
    b.setAttribute('aria-pressed', String(k === i));
  });
}

function renderModes() {
  els.modes.replaceChildren(...Array.from(state.freqs).map((f, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-pressed', String(i === state.selectedMode));
    const n = document.createElement('span');
    n.textContent = i + 1;
    const hz = document.createElement('span');
    hz.className = 'hz';
    hz.textContent = f.toFixed(0);
    btn.append(n, hz);
    btn.addEventListener('click', () => playMode(i));
    li.append(btn);
    return li;
  }));
}

// ------------------------------------------------------------------ controls

SHAPES.forEach((shape) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'chip';
  btn.textContent = shape.name;
  btn.setAttribute('aria-pressed', String(shape.id === state.shapeId));
  btn.addEventListener('click', () => {
    state.shapeId = shape.id;
    els.shapes.querySelectorAll('.chip').forEach((b) => {
      b.setAttribute('aria-pressed', String(b === btn));
    });
    solve();
  });
  els.shapes.append(btn);
});

/* The labels report the numbers the papers use. The director is redrawn live
 * while a slider moves, but re-solving waits for the drag to end: the director
 * enters the matrix non-linearly, so every value needs its own solve, and a
 * solve is a few hundred milliseconds. */
function renderLabels() {
  const { alpha, beta, theta } = nematicParams();
  els.alphaOut.textContent = alpha.toExponential(1).replace('e-', 'e\u2212');
  els.betaOut.textContent = beta === 0
    ? '0 (isotropic)' : beta.toExponential(1).replace('e-', 'e\u2212');
  els.thetaOut.textContent = `${Math.round((theta * 180) / Math.PI)}\u00b0`;
  board.setDirector(theta, beta > 0);
}

for (const control of [els.theta, els.beta, els.alpha]) {
  control.addEventListener('input', renderLabels);
  control.addEventListener('change', () => { renderLabels(); solve(); });
}

els.board.addEventListener('pointerdown', (e) => {
  els.board.focus();
  const p = board.fromClient(e.clientX, e.clientY);
  if (board.containsShapePoint(p.x, p.y)) strike(p.x, p.y);
});

els.sound.addEventListener('click', () => {
  state.muted = !state.muted;
  els.sound.setAttribute('aria-pressed', String(!state.muted));
  els.sound.textContent = state.muted ? 'sound off' : 'sound on';
});

// Hand the deck back the keys and the background clicks this page has no use
// for: without it, one tap on the drum leaves the clicker and `f` dead for the
// rest of the talk. The plate keeps its own clicks -- that is how you strike it.
forwardDeckNav('#board');

// Follow the deck's zoom control, like the other embeds in figs/.
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'html-talk-zoom') {
    document.documentElement.style.fontSize = e.data.pct + '%';
  }
});
if (window.parent !== window) window.parent.postMessage({ type: 'html-talk-ready' }, '*');

renderLabels();
solve();
requestAnimationFrame(frame);
</script>
</body>
</html>
